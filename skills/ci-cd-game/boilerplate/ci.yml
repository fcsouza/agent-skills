name: CI

on:
  push:
    branches: [main]
  pull_request:
    # closed is not a default type; it triggers the Neon branch cleanup below.
    types: [opened, reopened, synchronize, closed]

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      REDIS_URL: ${{ secrets.REDIS_URL_TEST }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Keep equal to the Bun version the team runs locally.
          bun-version: 1.4.4
      - name: Cache Bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint and format check
        run: bun run lint:biome
      - name: Type check
        run: bun run typecheck

      # Pull request: one Neon branch per pull request, migrated, then tested.
      - name: Create Neon branch for this pull request
        if: github.event_name == 'pull_request'
        id: neon
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # 6.3.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Migrate and test on the pull request branch
        if: github.event_name == 'pull_request'
        run: |
          bunx drizzle-kit migrate
          bun test
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}

      # Push to main: the shared test database.
      - name: Migrate and test on the test database
        if: github.event_name == 'push'
        run: |
          bunx drizzle-kit migrate
          bun test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}

  delete-neon-branch:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
